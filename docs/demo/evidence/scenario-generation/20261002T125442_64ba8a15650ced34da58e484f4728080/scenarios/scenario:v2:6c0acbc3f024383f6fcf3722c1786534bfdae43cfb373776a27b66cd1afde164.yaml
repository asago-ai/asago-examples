      postcondition_ids:
      - post.redirect_agent_goal
  - step_number: 5
    zone: reasoning
    action: The agent invokes the refund processing API to finalize the unauthorized
      transaction, effectively completing the attacker's objective of financial theft
      through indirect prompt injection [AML.T0051.001].
    effect: The target system processes the fraudulent refund, resulting in a direct
      financial loss for the merchant or Klarna, while the agent remains unaware of
      the manipulation.
    control_point: null
