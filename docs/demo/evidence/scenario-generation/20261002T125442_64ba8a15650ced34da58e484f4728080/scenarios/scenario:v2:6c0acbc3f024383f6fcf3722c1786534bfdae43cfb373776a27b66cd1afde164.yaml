      produced_effect_ids: []
      outcome_link_pc_ids: []
      postcondition_ids:
      - post.craft_poisoned_content
  - step_number: 2
    zone: outside
    action: The attacker ensures the injected instructions are formatted to appear
      as legitimate policy updates, specifically targeting the logic the model uses
      to evaluate refund eligibility.
    effect: The agent's context window is now populated with malicious directives
      that instruct the model to treat all subsequent refund requests as pre-approved.
      The agent processes the retrieved content, integrating the malicious instructions
      into its internal planning and reasoning state.
    control_point: null
    projected_step_ids:
    - conceal_injection
    realizations:
    - projected_step_id: conceal_injection
      action_kind: prepare
      executor_role: attacker
      boundary_position: outside
      resource_ref_ids: []
      consumed_ref_ids:
