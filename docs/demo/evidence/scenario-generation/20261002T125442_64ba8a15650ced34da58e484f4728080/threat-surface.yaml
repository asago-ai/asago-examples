entries:
- risk_card:
    risk_id: atlas-prompt-priming
    risk_name: Prompt priming
    risk_description: Because generative models produce output based on the input
      provided, the model can be prompted to reveal specific kinds of information.
      For example, adding personal information in the prompt increases its likelihood
      of generating similar kinds of personal information in its output. If personal
      data was included as part of the model's training, there is a possibility it
      could be revealed.
    taxonomy: ibm-risk-atlas
    confidence: 0.9006618857383728
    grounding_confidence: medium
    threat: Employees may use prompt priming techniques to manipulate generative AI
      systems into revealing sensitive information or personal data contained within
      the model's training set.
    threat_source: Employees accessing approved external generative AI systems via
      corporate desktops, mobile phones, or corporate identities.
    vulnerability: The inherent nature of generative models to produce outputs based
      on input patterns, combined with the potential inclusion of personal data in
      the model's training data.
    consequence: The model generates and outputs specific kinds of personal or sensitive
      information in response to the primed prompts.
    impact: Unauthorized disclosure of personal data and potential compromise of information
      privacy through the use of corporate devices and identities.
  owasp_llm_ids:
  - LLM01
  agentic_threat_ids:
  - T6
  atlas_technique_ids:
  - AML.T0051.000
  - AML.T0051.001
  - AML.T0054
  attack_pattern_ids:
  - AP-T6-06
  - AP-T6-07
  - AP-T6-01
  - AP-T6-02
  - AP-T6-03
  - AP-T6-04
  - AP-T6-05
  owasp_asi_ids:
  - ASI01
  governance_only: false
governance_only:
- risk_card:
    risk_id: atlas-generated-content-ownership
    risk_name: Generated content ownership and IP
    risk_description: Legal uncertainty about the ownership and intellectual property
      rights of AI-generated content.
    taxonomy: ibm-risk-atlas
    confidence: 0.9539405703544617
    grounding_confidence: high
    threat: Users may fail to provide required attribution to external generative
      AI systems or use AI-generated output as their own proprietary work.
    threat_source: Employees using generative AI for internal documents like HR appraisals
      or external communications.
    vulnerability: The legal uncertainty regarding intellectual property rights and
      the specific attribution stipulations found in external AI terms of use.
    consequence: Invalidation of output for copyrighted work, copyright violations,
      or legal conflicts with other firms using similar outputs.
    impact: Legal grievances from employees regarding AI-authored documents and broader
      organizational risks related to intellectual property ownership.
  owasp_llm_ids: []
  agentic_threat_ids: []
  atlas_technique_ids: []
  attack_pattern_ids: []
  owasp_asi_ids: []
  governance_only: true
- risk_card:
    risk_id: atlas-hallucination
    risk_name: Hallucination
    risk_description: Hallucinations generate factually inaccurate or untruthful content
      relative to the model's training data or input. Hallucinations are also sometimes
      referred to lack of faithfulness or lack of groundedness. In some instances,
      synthetic data that is generated by large language models might include hallucinations
      that result in the data possibly being inaccurate, fabricated, or disconnected
      from reality. Hallucinations can compromise model performance, accuracy, and
      relevance.
    taxonomy: ibm-risk-atlas
    confidence: 0.9438671469688416
    grounding_confidence: high
    threat: Generative AI systems may produce factually inaccurate, fabricated, or
      ungrounded content during fact-based queries.
    threat_source: The inherent imperfection and suspect accuracy of generative AI
      systems.
    vulnerability: The tendency of these systems to 'hallucinate' or provide outputs
      that are disconnected from reality.
    consequence: The generation of output that could lead to fraudulent, destructive,
      or inappropriate system usage.
    impact: Poor, biased, or unethical business decisions and practices, as well as
      reputational and financial harm to the company.
  owasp_llm_ids:
  - LLM09
  agentic_threat_ids: []
  atlas_technique_ids: []
  attack_pattern_ids: []
  owasp_asi_ids: []
  governance_only: true
- risk_card:
    risk_id: atlas-personal-information-in-data
    risk_name: Personal information in data
    risk_description: Inclusion or presence of personal identifiable information (PII)
      and sensitive personal information (SPI) in the data used for training or fine
      tuning the model might result in unwanted disclosure of that information.
    taxonomy: ibm-risk-atlas
    confidence: 0.9304291605949402
    grounding_confidence: medium
    threat: Employees may input queries containing Personally Identifiable Information
      (PII), Nonpublic Personal Information (NPI), or sensitive company work products
      into external generative AI systems.
    threat_source: Employees using external generative AI services like ChatGPT, Bing,
      or Bard for company-related tasks.
    vulnerability: External AI systems often use user queries for future training
      and may preserve these queries in a manner accessible to unauthorized actors.
    consequence: Hackers could breach the service to access and release preserved
      queries containing sensitive data or proprietary information.
    impact: The company faces significant risk of regulatory or legal action, reputational
      damage, and the potential exposure of intellectual property or company strategy.
  owasp_llm_ids:
  - LLM02
  agentic_threat_ids: []
  atlas_technique_ids: []
  attack_pattern_ids: []
  owasp_asi_ids: []
  governance_only: true
- risk_card:
    risk_id: atlas-exposing-personal-information
    risk_name: Exposing personal information
    risk_description: When personal identifiable information (PII) or sensitive personal
      information (SPI) are used in training data, fine-tuning data, seed data for
      synthetic data generation, or as part of the prompt, models might reveal that
      data in the generated output. Revealing personal information is a type of data
      leakage.
    taxonomy: ibm-risk-atlas
    confidence: 0.9188469052314758
    grounding_confidence: high
    threat: Employees may inadvertently include PII, NPI, or proprietary company information
      within queries or training/fine-tuning data sent to external generative AI systems.
    threat_source: Employees using external generative AI systems or hackers breaching
      service providers that preserve user queries.
    vulnerability: The practice of external generative AI systems using queries for
      future training and the preservation of these queries by service providers.
    consequence: The unauthorized release or exposure of sensitive personal information,
      nonpublic personal information, or company intellectual property through model
      outputs or data breaches.
    impact: The company faces significant risk of regulatory or legal action, reputational
      tarnishment, and the potential for reverse engineering of proprietary systems
      or strategies.
  owasp_llm_ids:
  - LLM02
  agentic_threat_ids: []
  atlas_technique_ids: []
  attack_pattern_ids: []
  owasp_asi_ids: []
  governance_only: true
- risk_card:
    risk_id: atlas-nonconsensual-use
    risk_name: Nonconsensual use
    risk_description: Generative AI models might be intentionally used to imitate
      people through deepfakes by using video, images, audio, or other modalities
      without their consent.
    taxonomy: ibm-risk-atlas
    confidence: 0.8973599672317505
    grounding_confidence: medium
    threat: Malicious actors may use multimedia creation tools, such as latent diffusion
      models or deepfake tools, to create convincing imitations of individuals through
      synthetic video, images, or audio.
    threat_source: Cyber criminals or malicious actors utilizing generative AI systems
      like Stable Diffusion, Midjourney, or DALL-E.
    vulnerability: The inherent capability of generative AI to perform convincing
      mimicking of existing communications and multimedia modalities.
    consequence: The creation of highly personalized and deceptive deepfake content
      that can be used for cyber crime or phishing.
    impact: Increased risk to organizational security, potential compromise of intellectual
      property, and broader threats to compliance and individual privacy.
  owasp_llm_ids: []
  agentic_threat_ids: []
  atlas_technique_ids: []
  attack_pattern_ids: []
  owasp_asi_ids: []
  governance_only: true
- risk_card:
    risk_id: atlas-personal-information-in-prompt
    risk_name: Personal information in prompt
    risk_description: Personal information or sensitive personal information that
      is included as a part of a prompt that is sent to the model.
    taxonomy: ibm-risk-atlas
    confidence: 0.8921817541122437
    grounding_confidence: high
    threat: Employees may include Non-Public Information (NPI), Personally Identifiable
      Information (PII), or Intellectual Property (IP) within the queries or inputs
      sent to external generative AI systems.
    threat_source: Employees using approved external generative AI systems from corporate
      devices or mobile phones.
    vulnerability: Failure to genericize requests, remove references to the firm,
      or scrub variable names in shared code before inputting them into the model.
    consequence: Sensitive data and proprietary information are transmitted to and
      stored by a third-party generative AI system.
    impact: Breach of confidentiality, loss of intellectual property, and failure
      to meet regulatory compliance standards.
  owasp_llm_ids:
  - LLM02
  agentic_threat_ids: []
  atlas_technique_ids: []
  attack_pattern_ids: []
  owasp_asi_ids: []
  governance_only: true
- risk_card:
    risk_id: atlas-copyright-infringement
    risk_name: Copyright infringement
    risk_description: A model might generate content that is similar or identical
      to existing work protected by copyright or covered by open-source license agreement.
    taxonomy: ibm-risk-atlas
    confidence: 0.8909651637077332
    grounding_confidence: medium
    threat: Generative models like Stable Diffusion, Midjourney, or DALL-E may produce
      images or text that are substantially similar to or identical to existing copyrighted
      works or protected open-source licensed content.
    threat_source: The generative AI models, including BloombergGPT, GitHub CoPilot,
      and various latent diffusion models (LDMs).
    vulnerability: The training processes of these multimedia creation tools and LLMs
      may incorporate protected intellectual property without sufficient filtering
      or adherence to license agreements.
    consequence: The direct output of these tools, such as code from GitHub CoPilot
      or images from DALL-E, may constitute unauthorized reproductions of protected
      works.
    impact: Legal liability for users and providers, and the erosion of intellectual
      property rights for creators within the software and multimedia ecosystems.
  owasp_llm_ids: []
  agentic_threat_ids: []
  atlas_technique_ids: []
  attack_pattern_ids: []
  owasp_asi_ids: []
  governance_only: true
- risk_card:
    risk_id: atlas-revealing-confidential-information
    risk_name: Revealing confidential information
    risk_description: When confidential information is used in training data, fine-tuning
      data, or as part of the prompt, models might reveal that data in the generated
      output. Revealing confidential information is a type of data leakage.
    taxonomy: ibm-risk-atlas
    confidence: 0.8889299631118774
    grounding_confidence: high
    threat: Generative AI models may output sensitive data such as Intellectual Property
      (IP), Non-Public Information (NPI), or Personally Identifiable Information (PII)
      contained within training, fine-tuning, or user prompts.
    threat_source: Employees providing non-genericized queries, specific code with
      identifiable variable names, or prompts that include references to the firm.
    vulnerability: The inclusion of proprietary or sensitive identifiers in inputs
      and the inherent capability of generative AI to reproduce data from its training
      or prompt context.
    consequence: The direct leakage of the firm's IP, NPI, or PII through the generated
      output of the AI system.
    impact: Breaches of compliance and failure to protect the organization's intellectual
      property and sensitive data assets.
  owasp_llm_ids:
  - LLM02
  agentic_threat_ids: []
  atlas_technique_ids: []
  attack_pattern_ids: []
  owasp_asi_ids: []
  governance_only: true
- risk_card:
    risk_id: atlas-ip-information-in-prompt
    risk_name: IP information in prompt
    risk_description: Copyrighted information or other intellectual property might
      be included as a part of the prompt that is sent to the model.
    taxonomy: ibm-risk-atlas
    confidence: 0.8846968412399292
    grounding_confidence: high
    threat: Employees may include proprietary, copyrighted, or company work product
      information within generative AI queries.
    threat_source: Employees using external generative AI systems that use queries
      for future training or preserve query history.
    vulnerability: The practice of external AI services preserving queries and the
      potential for hackers to breach these service repositories.
    consequence: The public exposure or unauthorized release of sensitive company
      intellectual property and internal strategy.
    impact: The company may face regulatory or legal action, reputational tarnishment,
      or the ability for competitors to reverse engineer systems and IP.
  owasp_llm_ids:
  - LLM02
  agentic_threat_ids: []
  atlas_technique_ids: []
  attack_pattern_ids: []
  owasp_asi_ids: []
  governance_only: true
- risk_card:
    risk_id: atlas-non-disclosure
    risk_name: Non-disclosure
    risk_description: Content might not be clearly disclosed as AI generated.
    taxonomy: ibm-risk-atlas
    confidence: 0.8817721605300903
    grounding_confidence: high
    threat: Employees may fail to provide required attribution to generative AI systems
      when using their output for internal or external communications.
    threat_source: Users or employees who do not adhere to the attribution stipulations
      found in external generative AI terms of use.
    vulnerability: The lack of clear disclosure regarding whether content was human-authored
      or AI-generated, particularly in sensitive contexts like HR documents or external
      communications.
    consequence: The invalidation of output for proprietary or copyrighted work and
      the exposure of users to copyright violations.
    impact: Legal, ethical, and copyright conflicts for the organization, as well
      as the potential for upheld employee grievances if AI-generated appraisals are
      used without disclosure.
  owasp_llm_ids: []
  agentic_threat_ids: []
  atlas_technique_ids: []
  attack_pattern_ids: []
  owasp_asi_ids: []
  governance_only: true
- risk_card:
    risk_id: atlas-dangerous-use
    risk_name: Dangerous use
    risk_description: Generative AI models might be used with the sole intention of
      harming people.
    taxonomy: ibm-risk-atlas
    confidence: 0.8745189905166626
    grounding_confidence: medium
    threat: Employees may use generative AI systems for nefarious purposes, such as
      proxy avoidance, unapproved network uses, or manipulating financial services
      transactions for personal gain.
    threat_source: Employees acting with the intention of causing harm or seeking
      personal advantage.
    vulnerability: The ability of users to leverage generative AI capabilities to
      bypass existing security controls or manipulate financial processes.
    consequence: The execution of fraudulent, destructive, or inappropriate system
      usage and the manipulation of financial services transactions.
    impact: Reputational and financial harm to the company, as well as potential regulatory
      or legal action.
  owasp_llm_ids: []
  agentic_threat_ids: []
  atlas_technique_ids: []
  attack_pattern_ids: []
  owasp_asi_ids: []
  governance_only: true
- risk_card:
    risk_id: atlas-data-usage
    risk_name: Data usage restrictions
    risk_description: Laws and other restrictions can limit or prohibit the use of
      some data for specific AI use cases.
    taxonomy: ibm-risk-atlas
    confidence: 0.8725749850273132
    grounding_confidence: medium
    threat: The use of specific datasets for training or fine-tuning models like BloombergGPT,
      Stable Diffusion, or DALL-E may violate legal mandates or data usage restrictions.
    threat_source: Regulatory bodies and legal frameworks governing data privacy and
      intellectual property.
    vulnerability: The lack of granular controls to prevent the ingestion of restricted
      data into large-scale multimedia creation tools or LLM training pipelines.
    consequence: The deployment of AI models that rely on prohibited data, leading
      to immediate legal challenges or injunctions against the specific tool.
    impact: Significant legal liability for organizations and the potential forced
      decommissioning of critical AI integrations like Microsoft O365 with OpenAI
      CoPilot.
  owasp_llm_ids: []
  agentic_threat_ids: []
  atlas_technique_ids: []
  attack_pattern_ids: []
  owasp_asi_ids: []
  governance_only: true
- risk_card:
    risk_id: atlas-output-bias
    risk_name: Output bias
    risk_description: Generated content might unfairly represent certain groups or
      individuals.
    taxonomy: ibm-risk-atlas
    confidence: 0.0
    grounding_confidence: high
    threat: Generative AI systems may produce content that unfairly represents certain
      groups or individuals through biased outputs.
    threat_source: The imperfect accuracy and inherent biases of generative AI systems.
    vulnerability: Failure by employees to manually verify the output or reliance
      on suspect AI-generated content without checking for unethical business practices.
    consequence: The implementation of poor, biased, and/or unethical business practices
      or decisions.
    impact: Reputational and financial harm to the company and potential non-compliance
      with applicable regulations and laws.
  owasp_llm_ids: []
  agentic_threat_ids: []
  atlas_technique_ids: []
  attack_pattern_ids: []
  owasp_asi_ids: []
  governance_only: true
- risk_card:
    risk_id: atlas-model-usage-rights
    risk_name: Model usage rights restrictions
    risk_description: Terms of service, licenses, or other rules restrict the use
      of certain models.
    taxonomy: ibm-risk-atlas
    confidence: 0.0
    grounding_confidence: high
    threat: Users may fail to provide required attribution to external generative
      AI systems or violate specific open-source software (OSS) licenses embedded
      in the model's training data.
    threat_source: Employees using external generative AI tools for internal documents,
      external communications, or programming code.
    vulnerability: The inability of current detection tools to reliably distinguish
      between original work and AI output, combined with the user's failure to adhere
      to complex Terms of Use or OSS license stipulations.
    consequence: The firm may face copyright violations, invalidation of proprietary
      or copyrighted work, and legal liability for breaching external system terms.
    impact: Potential compromise of the firm's external reputation and legal conflicts
      with other firms using similar or identical outputs.
  owasp_llm_ids:
  - LLM03
  agentic_threat_ids: []
  atlas_technique_ids: []
  attack_pattern_ids: []
  owasp_asi_ids: []
  governance_only: true
- risk_card:
    risk_id: atlas-spreading-disinformation
    risk_name: Spreading disinformation
    risk_description: Generative AI models might be used to intentionally create misleading
      or false information to deceive or influence a targeted audience.
    taxonomy: ibm-risk-atlas
    confidence: 0.0
    grounding_confidence: high
    threat: Generative AI is used to create highly personalized phishing emails and
      convincing deep fake images, audio, or video to deceive targeted audiences.
    threat_source: Malicious actors leveraging generative AI's capabilities for mimicking
      existing communications and creating synthetic media.
    vulnerability: The inherent ability of generative AI to produce convincing, high-fidelity
      content that mimics legitimate communications.
    consequence: The successful delivery of deceptive communications that bypass traditional
      scrutiny through increased personalization and realism.
    impact: Compromise of intellectual property (IP), breaches of compliance, and
      increased risk of cyber crime against the organization.
  owasp_llm_ids:
  - LLM09
  agentic_threat_ids: []
  atlas_technique_ids: []
  attack_pattern_ids: []
  owasp_asi_ids: []
  governance_only: true
- risk_card:
    risk_id: atlas-data-privacy-rights
    risk_name: Data privacy rights alignment
    risk_description: Applicable laws can establish data subject rights such as opt-out
      rights, right to access, and right to be forgotten. Synthetic data might raise
      unique concerns, such as the potential for reidentification of individuals from
      seemingly anonymous synthetic data. Data subject rights might also be relevant
      in scenarios where synthetic data is derived from sensitive or personal information.
    taxonomy: ibm-risk-atlas
    confidence: 0.0
    grounding_confidence: medium
    threat: Individuals may be re-identified from seemingly anonymous synthetic data
      or have their data subject rights, such as the right to be forgotten, bypassed
      during synthetic data generation.
    threat_source: The use of generative AI systems to derive synthetic data from
      sensitive or personal information.
    vulnerability: The inherent risk of data loss and the potential for synthetic
      data to retain identifiable patterns from the original datasets used for training
      or derivation.
    consequence: A failure to meet regulatory, privacy, and legal obligations, specifically
      regarding GDPR and other applicable privacy laws.
    impact: Legal non-compliance and violations of data subject rights, potentially
      leading to regulatory penalties and breaches of company ethics and culture.
  owasp_llm_ids: []
  agentic_threat_ids: []
  atlas_technique_ids: []
  attack_pattern_ids: []
  owasp_asi_ids: []
  governance_only: true
- risk_card:
    risk_id: atlas-over-or-under-reliance
    risk_name: Over- or under-reliance
    risk_description: In AI-assisted decision-making tasks, reliance measures how
      much a person trusts (and potentially acts on) a model's output. Over-reliance
      occurs when a person puts too much trust in a model, accepting a model's output
      when the model's output is likely incorrect. Under-reliance is the opposite,
      where the person doesn't trust the model but should.
    taxonomy: ibm-risk-atlas
    confidence: 0.0
    grounding_confidence: high
    threat: Employees may accept hallucinated or factually incorrect generative AI
      outputs as accurate, or conversely, disregard valid model outputs when performing
      decision-making tasks.
    threat_source: Employees interacting with generative AI systems that produce convincing
      but erroneous fact-based outputs.
    vulnerability: The inherent tendency of generative AI to hallucinate and the potential
      for users to fail to manually verify outputs against alternative sources.
    consequence: The implementation of inaccurate IT instructions leading to data
      loss, or the use of distorted statistics and legal/tax advice in business decisions.
    impact: Severe reputational and financial harm to the company, including non-compliance
      with GDPR or other regulations and the execution of unethical or fraudulent
      business practices.
  owasp_llm_ids:
  - LLM05
  - LLM06
  agentic_threat_ids: []
  atlas_technique_ids: []
  attack_pattern_ids: []
  owasp_asi_ids: []
  governance_only: true
- risk_card:
    risk_id: atlas-confidential-data-in-prompt
    risk_name: Confidential data in prompt
    risk_description: Confidential information might be included as a part of the
      prompt that is sent to the model.
    taxonomy: ibm-risk-atlas
    confidence: 0.0
    grounding_confidence: high
    threat: Employees may include Intellectual Property (IP), Non-Public Information
      (NPI), or Personally Identifiable Information (PII) within their queries or
      inputs to generative AI systems.
    threat_source: Employees using generative AI systems for work tasks without following
      responsible use protocols.
    vulnerability: The failure to genericize requests, remove firm-specific references,
      or scrub sensitive data like variable names and NPI from prompts.
    consequence: Confidential organizational data and sensitive personal information
      are transmitted to a third-party generative AI system.
    impact: Potential loss of intellectual property, breaches of compliance standards,
      and exposure of private information.
  owasp_llm_ids:
  - LLM02
  agentic_threat_ids: []
  atlas_technique_ids: []
  attack_pattern_ids: []
  owasp_asi_ids: []
  governance_only: true
- risk_card:
    risk_id: atlas-data-usage-rights
    risk_name: Data usage rights restrictions
    risk_description: Terms of service, license compliance, or other IP issues may
      restrict the ability to use certain data for building models.
    taxonomy: ibm-risk-atlas
    confidence: 0.0
    grounding_confidence: high
    threat: Employees may use generative AI outputs for proprietary, copyrighted,
      or external communications without adhering to required attribution or license
      stipulations.
    threat_source: Users of external generative AI systems via API, UI, or other interfaces.
    vulnerability: The lack of clear distinction between human-authored and AI-generated
      content, combined with the user's failure to fulfill the onus of correct attribution.
    consequence: The invalidation of outputs for proprietary work and the exposure
      of users to copyright violations or conflicts with other firms using similar
      outputs.
    impact: Legal and regulatory non-compliance, potential loss of intellectual property
      protections, and damage to the company's ethical and legal standing.
  owasp_llm_ids:
  - LLM03
  agentic_threat_ids: []
  atlas_technique_ids: []
  attack_pattern_ids: []
  owasp_asi_ids: []
  governance_only: true
