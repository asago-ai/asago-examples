[project]
name = "asago-examples"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "jupyterlab>=4.6.2"
]

[project.optional-dependencies]
policy-mapper = [
    "asago-policy-mapper-examples",
]
artifact-generator = [
    "asago-artifact-generator-examples",
]
scenario-generator = [
    "asago-scenario-generator-examples",
]

[tool.uv]
# asago-policy-mapper declares ai-atlas-nexus floating on @main; override it to the
# release whose data schema the notebooks and example inputs are built against.
override-dependencies = [
    "ai-atlas-nexus @ git+https://github.com/IBM/ai-atlas-nexus.git@v1.2.3",
]

[tool.uv.workspace]
members = ["asago-*"]

[tool.uv.sources]
asago-policy-mapper-examples = { workspace = true }
asago-artifact-generator-examples = { workspace = true }
asago-scenario-generator-examples = { workspace = true }
