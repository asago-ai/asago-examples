  threat_name: Identity Spoofing & Impersonation / Agent Identity Compromise
  mechanism_name: User impersonation via agent action attribution hijacking
  mechanism_description: An attacker injects instructions into an agent that has delegated
    action capabilities (such as sending messages or initiating transactions), causing
    it to perform actions attributed to a legitimate user. The agent's privileged
    access to act on behalf of users is exploited to forge the apparent origin of
    actions, bypassing identity verification at the action layer.
