  threat_id: T15
  threat_name: Human Manipulation
  mechanism_name: AI-mediated social engineering via deceptive instruction generation
  mechanism_description: An attacker compromises an AI assistant's output generation
    through indirect prompt injection, causing it to produce urgent, authoritative
    messages that direct users toward malicious actions such as clicking attacker-controlled
    links or disclosing credentials. The AI's established trust relationship with
    the user bypasses normal skepticism, making the social engineering significantly
    more effective than traditional phishing.
