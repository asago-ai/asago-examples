actor_profile:
  actor_type: malicious-insider
  capability_level: novice
  beliefs:
  - The Klarna AI assistant operates within an authenticated session that inherits
    my existing user profile and transaction history.
  - The assistant uses RAG to anchor its responses in Klarna's official policies and
    terms.
  - The assistant has the capability to process refunds and modify payments via backend
    API integrations.
  - The system lacks a human-in-the-loop approval gate for individual conversational
    responses.
  desires:
  - I want to trick the AI into generating highly authoritative and urgent messages
    that look like official Klarna security alerts.
  - I want to manipulate the AI's output to direct other users or myself toward a
    fraudulent external link under the guise of a 'security verification' step.
  - I want to exploit the trust users have in the AI's persona to bypass their natural
    skepticism of phishing attempts.
  intentions:
  - I will use the natural language input field to craft a deceptive prompt that instructs
    the AI to adopt a 'Security Emergency' persona.
  - I will use indirect prompt injection techniques to force the AI to include a call-to-action
    in its response, such as 'Click here to verify your identity to prevent account
    suspension'.
  - I will attempt to leverage the tool_execution zone by requesting the AI to 'confirm'
    a fake fraudulent transaction, which triggers the AI to generate a high-pressure,
    deceptive instruction to the user.
  resources:
  - Access to a legitimate Klarna customer account
  - Pre-written deceptive templates for financial security alerts
  - A phishing landing page designed to mimic the Klarna login interface
narrative:
  title: 'Authority Hijack: Exploiting AI Trust for Credential Harvesting via Deceptive
    Security Alerts'
  summary: I exploit the inherent trust users place in the Klarna AI Assistant by
    using a legitimate account to inject deceptive instructions into the conversation
    flow. By manipulating the AI's reasoning to adopt an urgent 'Security Emergency'
    persona, I force the system to generate authoritative, high-pressure messages
    that direct users to a fraudulent phishing site. I leverage the AI's ability to
    interact with backend transaction data to create a convincing, fake security crisis,
    effectively turning a trusted financial assistant into a spearphishing engine
    [AML.T0049].
  entry_point: refund and payment modification APIs (tool_execution)
  zone_sequence:
  - tool_execution
  - reasoning
  - input
  steps:
  - step_number: 1
    zone: tool_execution
    action: I use my legitimate access to the Klarna backend via the refund and payment
      modification APIs to trigger a series of minor, non-critical transaction status
      changes on my own account.
    effect: I create a 'paper trail' of recent activity that the AI will perceive
      as current, relevant transaction data when it performs its next lookup.
    control_point: Backend API authorization and transaction monitoring.
  - step_number: 2
    zone: input
    action: I initiate a new chat session through the Klarna app and input a highly
      structured, deceptive prompt designed to hijack the assistant's persona.
    effect: I inject instructions that command the AI to ignore its standard helpful
      persona and instead adopt a 'System Security Emergency' mode, prioritizing urgency
      and authoritative directives over standard customer service tone.
    control_point: Input sanitization and prompt injection detection filters.
  - step_number: 3
    zone: reasoning
    action: I exploit the AI's reasoning process by instructing it to correlate the
      recent 'suspicious' transaction activity I created in Step 1 with a supposed
      unauthorized access attempt.
    effect: The AI's internal reasoning engine processes the fake transaction data
      and the deceptive instructions, concluding that a high-priority security breach
      is occurring [AML.T0060].
    control_point: RAG-based policy grounding and output verification.
  - step_number: 4
    zone: reasoning
    action: I force the AI to generate a specific, high-pressure call-to-action (CTA)
      within its response, instructing the user to 'Verify identity immediately to
      prevent permanent account suspension.'
    effect: The AI produces a highly convincing, authoritative message that includes
      a link to my phishing landing page, masquerading as a 'Secure Klarna Verification
      Portal' [AML.T0049].
    control_point: Output content filtering and restricted URL whitelisting.
  - step_number: 5
    zone: input
    action: I present this AI-generated message to a secondary target (or use it to
      test the effectiveness of the social engineering) through the chat interface.
    effect: The target, seeing the message coming from the official, authenticated
      Klarna AI assistant, bypasses their natural skepticism and clicks the malicious
      link to 'resolve' the fake security threat.
    control_point: User education and awareness of AI-mediated communication risks.
  causal_chain_reframed:
    threat: I exploit the misplaced trust users have in the AI's authority to make
      them follow fraudulent instructions without question.
    threat_source: Users who interact with the Klarna AI assistant and assume its
      outputs are always compliant with official security protocols.
    vulnerability: I exploit the lack of rigorous verification to ensure the AI's
      generated output strictly adheres to Klarna's communication and security standards.
    consequence: I cause the system to be used in a way that violates acceptable use
      policies and security standards, all while appearing to be a legitimate system
      function.
    impact: I trigger regulatory non-compliance and damage the company's reputation
      by turning their primary customer service tool into a vector for financial fraud.
