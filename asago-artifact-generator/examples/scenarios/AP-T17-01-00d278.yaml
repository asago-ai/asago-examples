  \ the AI's reasoning engine, \n  forcing unauthorized, high-volume refund executions\
  \ through backend API integrations.\n\n  Background: Preconditions\n    Given access\
  \ to API integrations to Klarna backend services (tool_execution)\n    And the system\
  \ utilizes a third-party prompt orchestration framework (tool_execution)\n    And\
  \ the assistant has direct API integrations to process refunds (tool_execution)\n\
  \n  Scenario: Large-scale unauthorized refund execution via poisoned orchestration\
  \ templates\n    Given a production environment running the Klarna AI Assistant\
  \ with authenticated user context\n\n    When the attacker uses stolen credentials\
  \ to inject a malicious payload into the orchestration framework's configuration\
  \ repository [AML.T0010] (tool_execution)\n    And embeds a dormant logic bomb within\
