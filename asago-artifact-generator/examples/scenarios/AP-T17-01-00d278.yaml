  mechanism_name: Upstream artifact poisoning via repository compromise
  mechanism_description: An attacker injects malicious instructions or code into a
    public or shared repository that serves as an upstream dependency for an AI agent's
    prompt templates, tool definitions, or configuration. When the agent's build or
    deployment pipeline pulls the compromised artifact, the payload executes with
    the agent's full privileges, potentially affecting all downstream users before
    the compromise is detected.
