[project]
name = "asago-demo-examples"
version = "0.1.0"
dependencies = [
    "asago-policy-mapper-examples",
    "asago-scenario-generator-examples",
    "asago-artifact-generator-examples",
    "ipykernel>=6.0",
    "httpx>=0.28",
    "python-dotenv>=1.0",
    "certifi",
    "pypdfium2>=5.11",
    "pillow>=11",
    "pytest>=8.0",
    "ruff>=0.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["asago_demo"]

[tool.uv.sources]
asago-policy-mapper-examples = { workspace = true }
asago-scenario-generator-examples = { workspace = true }
asago-artifact-generator-examples = { workspace = true }

[tool.ruff]
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I"]
